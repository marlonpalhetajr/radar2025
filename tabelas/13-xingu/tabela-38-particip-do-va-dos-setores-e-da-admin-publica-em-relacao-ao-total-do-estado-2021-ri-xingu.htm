        const colunas = ["Estado/Municípios", "% Participação PIB Estadual", "% Participação VA Agropecuária Estadual", "% Participação VA Industrial Estadual", "% Participação VA Serviços Estadual, Exclusive Administração Pública", "% Participação VA Administração Pública Estadual", "% Participação VA Total Estadual"];
        const notas = [
  "Fonte: FAPESPA/IBGE",
  "Elaboração: FAPESPA"
];
        const regiaoAtual = "Xingu";

        document.addEventListener('DOMContentLoaded', function() {
            // Reordenar dados para colocar a região principal primeiro
            if (regiaoAtual && regiaoAtual.trim() !== "") {
                const regiaoDados = regiaoAtual.toLowerCase().replace(/ri\s*/, '').trim();
                
                tabelaDados.sort((a, b) => {
                    const aText = a.col0 ? a.col0.toLowerCase().replace(/ri\s*/, '').trim() : '';
                    const bText = b.col0 ? b.col0.toLowerCase().replace(/ri\s*/, '').trim() : '';
                    
                    // Verifica correspondência exata
                    if (aText === regiaoDados) return -1;
                    if (bText === regiaoDados) return 1;
                    
                    // Verifica correspondência parcial (para casos como "RI Araguaia" vs "Araguaia")
                    if (aText.includes(regiaoDados)) return -1;
                    if (bText.includes(regiaoDados)) return 1;
                    
                    return 0;
                });
            }
            const thead = document.querySelector('#tableHeader');
            const tbody = document.querySelector('#tabelaDados tbody');
            const notesEl = document.querySelector('#tableNotes');

            colunas.forEach(col => {
                const th = document.createElement('th');
                th.textContent = col || '';
                thead.appendChild(th);
            });
            
            tabelaDados.forEach(row => {
                const tr = document.createElement('tr');
                for (let i = 0; i < colunas.length; i++) {
                    const td = document.createElement('td');
                    const valor = row[`col${i}`];
                    
                    if (typeof valor === 'number') {
                        if (Number.isInteger(valor) && valor > 1000) {
                            td.textContent = new Intl.NumberFormat('pt-BR').format(valor);
                        } else {
                            td.textContent = new Intl.NumberFormat('pt-BR', {
                                minimumFractionDigits: 0,
                                maximumFractionDigits: 4
                            }).format(valor);
                        }
                    } else {
                        td.textContent = valor || '';
                        if (i === 0) td.style.textAlign = 'left';
                    }
                    tr.appendChild(td);
                }
                tbody.appendChild(tr);
            });

            $('#tabelaDados').DataTable({
                language: {
                    emptyTable: "Nenhum dado disponível na tabela",
                    info: "Mostrando _START_ a _END_ de _TOTAL_ registros",

                        last: "Último",

                    }
                },
                paging: true,
                pageLength: 25,
                lengthMenu: [[10, 25, 50, -1], [10, 25, 50, "Todos"]],
                searching: true,
                ordering: true,
                info: true,
                responsive: true,
                dom: '<"row"<"col-sm-12 col-md-6"l><"col-sm-12 col-md-6"f>>rt<"row"<"col-sm-12 col-md-5"i><"col-sm-12 col-md-7"p>>'
            });

            if (notas.length) {
                notesEl.innerHTML = notas.map(nota => `<div>${nota}</div>`).join('');
            }
        });

        function exportToExcel() {
            const ws_data = [colunas];
            
            tabelaDados.forEach(row => {
                const rowData = [];
                for (let i = 0; i < colunas.length; i++) {
                    rowData.push(row[`col${i}`]);
                }
                ws_data.push(rowData);
            });

            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.aoa_to_sheet(ws_data);
            
            const colWidths = colunas.map(() => ({ wch: 20 }));
            ws['!cols'] = colWidths;
            
            XLSX.utils.book_append_sheet(wb, ws, 'Dados');
            
            const nomeArquivo = 'tabela-38-particip-do-va-dos-setores-e-da-admin-publica-em-relacao-ao-total-do-estado-2021-ri-xingu.xlsx';
            XLSX.writeFile(wb, nomeArquivo);
            
            const btn = document.querySelector('.btn-export');
            const textoOriginal = btn.innerHTML;
            btn.innerHTML = '<i class="bi bi-check-circle"></i> Download Concluído!';
            btn.style.backgroundColor = '#198754';
            setTimeout(() => {
                btn.innerHTML = textoOriginal;
                btn.style.backgroundColor = '';
            }, 2000);
